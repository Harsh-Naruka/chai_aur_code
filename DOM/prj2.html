<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="prj2.css">
</head>
<body>
    <nav>
        <a href="http://" target="_blank" >HOME</a>
        <a href="https://www.youtube.com/" target="_blank" >YT</a>
    </nav>

    <div class="container">
        <h1>BMI CALCULATOR</h1>

        <form>

            <p><label>Height in CM:</label>
                <input type="text" id="height">
            </p>
            <p><label>Weight in KG:</label>
            <input type="text" id="weight">
            </p>

            <button>Calculate</button>

            <div id="results"></div>

            <div id="weight-guide">
                <h2>BMI Weight Guide</h2>
                <p>Under Weight = Less than 18.6</p>
                <p>Over Weight = Greater than 24.9</p>
                <p>Normal Range = 18.6 - 24.9</p>
            </div>
        </form>
    </div>
</body>
</html>
